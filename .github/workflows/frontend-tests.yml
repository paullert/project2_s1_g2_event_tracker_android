name: Frontend tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Android unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses > /dev/null
          "$sdkmanager_path" "platforms;android-37.0"
          if [ ! -e "$sdk_root/platforms/android-37" ]; then
            ln -s android-37.0 "$sdk_root/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run frontend tests
        run: >-
          ./gradlew :app:testDebugUnitTest
          -PGOOGLE_CLIENT_ID=000000000000-ci.apps.googleusercontent.com
          -PAPI_BASE_URL=https://localhost/
